[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cogent"
version = "0.2.0"
description = "Condition-dependent gene embeddings from spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy", "scipy", "pandas", "torch>=2.4", "einops",
    "anndata", "scanpy", "scikit-learn", "igraph",
    "pynndescent", "umap-learn", "zarr>=3", "matplotlib>=3.9",
    "h5py", "numba", "tqdm",
]

[project.optional-dependencies]
benchmarks = ["networkx", "torch-geometric", "pytorch-metric-learning", "scETM"]

[project.scripts]
cogent-train = "cogent.training:main"

[tool.setuptools.packages.find]
where = ["src"]
